<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f4e8c" />
  <title>니어미스 신고</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>니어미스 신고</h1>
    <p class="subtitle">아차사고를 공유하면 큰 사고를 막을 수 있습니다</p>
  </header>

  <nav class="tabs" role="tablist">
    <button type="button" role="tab" id="tab-btn-report" data-tab="report" aria-controls="tab-report" aria-selected="true">신고하기</button>
    <button type="button" role="tab" id="tab-btn-stats" data-tab="stats" aria-controls="tab-stats" aria-selected="false">통계</button>
  </nav>

  <main class="container" id="tab-report" role="tabpanel" aria-labelledby="tab-btn-report">
    <div id="voice-support-notice" class="notice" hidden></div>

    <form id="nearmiss-form" novalidate>
      <label for="content" class="main-label">어떤 일이 있었나요?</label>
      <ul class="hint">
        <li>언제</li>
        <li>어디서</li>
        <li>무슨 일이</li>
        <li>왜</li>
        <li>개선 아이디어</li>
      </ul>

      <textarea id="content" name="content" rows="8" required
        placeholder="예) 오늘 오후 2시쯤 2공장 3라인 컨베이어 옆에서 바닥에 기름이 새어 있어서 미끄러질 뻔했어요. 배관 연결부에서 새는 것 같고, 미끄럼 방지 매트를 깔면 좋겠어요."></textarea>

      <button type="button" id="mic-btn" class="mic-btn" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/>
        </svg>
        <span class="mic-label">눌러서 말하기</span>
      </button>

      <button type="submit" class="btn-submit">신고하기</button>
    </form>

    <section class="history">
      <h2>내 신고 내역</h2>
      <ul id="history-list"></ul>
    </section>

    <details class="card settings" id="settings">
      <summary>내 정보 · 설정</summary>
      <p class="card-sub">한 번만 입력하면 이후 신고마다 자동으로 들어갑니다.</p>

      <label for="profile-org">소속</label>
      <input type="text" id="profile-org" autocomplete="organization" placeholder="예) 두원기업" />

      <label for="profile-name">성명</label>
      <input type="text" id="profile-name" autocomplete="name" placeholder="예) 박민수" />
      <p class="field-hint">보고서에는 <strong>박 ○○</strong> 처럼 가려서 나갑니다. 실명은 관리자만 볼 수 있습니다.</p>

      <label for="profile-role">직무</label>
      <input type="text" id="profile-role" placeholder="예) 축로공" />

      <label for="admin-token">관리자 토큰 <span class="field-note">(관리자만)</span></label>
      <input type="password" id="admin-token" autocomplete="off" placeholder="관리자 탭을 쓰려면 입력" />

      <button type="button" id="save-settings" class="btn-secondary">저장</button>
    </details>
  </main>

  <main class="container" id="tab-stats" role="tabpanel" aria-labelledby="tab-btn-stats" hidden>
    <div id="stats-root"></div>
  </main>

  <div id="toast" class="toast" role="alert" hidden></div>

  <script src="js/profile.js"></script>
  <script src="js/store.js"></script>
  <script src="js/classify.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/voice-input.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
